[package]
name = "revenant-gui"
description = "GTK4/libadwaita GUI frontend for the Revenant system snapshot tool"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "revenant-gui"
path = "src/main.rs"

[dependencies]
revenant-core = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
zbus = { workspace = true }
zvariant = { workspace = true }

# GUI-only dependencies — kept local to this crate.
# `v4_10` enables `gtk::FileLauncher`, used to open a snapshot's
# read-only mount in the user's default file manager. GTK 4.10
# shipped in 2023; every supported distro has it.
gtk = { package = "gtk4", version = "0.9", features = ["v4_10"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_5"] }

# Runtime-agnostic channel: the dbus-worker pushes events from a
# tokio runtime, the GTK side drains on the glib MainContext.
async-channel = "2"

# StreamExt for `.next()` on zbus signal streams. zbus pulls
# futures-util in transitively but we depend on it directly to keep
# the import explicit.
futures-util = "0.3"
